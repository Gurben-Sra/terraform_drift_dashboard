[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terraform-drift-dashboard"
version = "0.1.0"
description = "Compare Terraform-managed EC2 instance types with live AWS configuration."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34",
]

[project.scripts]
terraform-drift-dashboard = "terraform_drift_dashboard.cli:main"

[tool.setuptools.packages.find]
include = ["terraform_drift_dashboard*"]
